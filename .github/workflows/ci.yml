name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used anywhere in this workflow: unit tests mock the database models and the E2E suite runs the
# front end against its built-in mock API (VITE_USE_MOCK_API) with every /api request blocked.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests, types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # server/ is not covered by tsc -b; fails only on errors that are not in server/typecheck-baseline.json
      - run: npm run typecheck:server
      - run: npm run lint
      - name: Build (deployable configuration)
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
      - name: Verify the build is a deployable production artifact
        run: npm run verify:artifact -- dist
      # Negative control: an e2e (mock API) build must be rejected by the artifact check
      - name: E2E build must fail artifact verification
        run: |
          VITE_USE_MOCK_API=true npx vite build --mode e2e --outDir "$RUNNER_TEMP/e2e-check/dist-e2e"
          if npm run verify:artifact -- "$RUNNER_TEMP/e2e-check/dist-e2e" > "$RUNNER_TEMP/e2e-verify.log" 2>&1; then
            echo "::error::verify:artifact accepted an e2e build"; exit 1
          fi
          grep -q "built with --mode e2e" "$RUNNER_TEMP/e2e-verify.log" || { cat "$RUNNER_TEMP/e2e-verify.log"; exit 1; }
      # Negative control for the build guard (src/config/deployment.ts): a mock-API build must never succeed
      - name: Mock-API production build must fail
        run: |
          if VITE_USE_MOCK_API=true VITE_API_BASE_URL=/api npx vite build --outDir "$RUNNER_TEMP/mock-build" > "$RUNNER_TEMP/mock-build.log" 2>&1; then
            echo "::error::vite build succeeded with VITE_USE_MOCK_API=true"; exit 1
          fi
          # it must fail because of the guard, not for an unrelated reason
          grep -q "VITE_USE_MOCK_API=true is not allowed" "$RUNNER_TEMP/mock-build.log" || { cat "$RUNNER_TEMP/mock-build.log"; exit 1; }

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Chromium, full suite)
        run: npm run e2e
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-real:
    name: Playwright E2E (real API and MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # a disposable database for this job only (see server/e2e/testDatabase.ts for what the suite accepts)
      mongo:
        image: mongo:7.0
        ports:
          - 27999:27017
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27999/algoflow_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run real-backend E2E tests
        run: npm run e2e:real
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: |
            playwright-report/real/
            test-results/real/
          retention-days: 14

  # the same projects as `npm run e2e:cross`, split across runners: in one job (about 1,360 tests) the suite outgrew a
  # 45-minute limit. Desktop Firefox and WebKit run every non-@mobile test; WebKit, the slowest, is split in two shards.
  e2e-cross:
    name: Playwright E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # one browser's failure does not cancel the others' results
      fail-fast: false
      matrix:
        include:
          - { id: firefox, name: 'Firefox', browsers: firefox, projects: '--project=firefox', shard: '1/1' }
          - { id: webkit-1, name: 'WebKit 1/2', browsers: webkit, projects: '--project=webkit', shard: '1/2' }
          - { id: webkit-2, name: 'WebKit 2/2', browsers: webkit, projects: '--project=webkit', shard: '2/2' }
          - { id: mobile, name: 'Pixel 7 and iPhone 14 emulation', browsers: 'chromium webkit', projects: '--project=mobile-chromium --project=mobile-webkit', shard: '1/1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Run E2E tests (${{ matrix.name }})
        run: npx playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-${{ matrix.id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
